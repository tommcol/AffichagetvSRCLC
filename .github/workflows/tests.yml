name: Tests

# Contrôle qualité automatique : lint TypeScript puis suite de tests.
# Relancé à chaque push sur main et chaque pull request vers main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  tests:
    name: Contrôle qualité (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer les dépendances
        run: npm install

      - name: Vérification TypeScript (lint)
        run: npm run lint

      - name: Lancer les tests
        run: npm test 2>&1 | tee ci-test-output.log

      - name: Publier le journal des tests (diagnostic)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-test-output.log
          git commit -m "Journal des tests (diagnostic CI) [skip ci]" || echo "rien à committer"
          git push
