<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Basketball Circle -->
  <circle cx="256" cy="220" r="140" fill="url(#ballGrad)" stroke="#ffffff" stroke-width="8"/>
  <!-- Basketball Lines -->
  <path d="M 116 220 H 396" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <path d="M 256 80 V 360" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <path d="M 160 115 A 140 140 0 0 1 160 325" fill="none" stroke="#ffffff" stroke-width="8"/>
  <path d="M 352 115 A 140 140 0 0 0 352 325" fill="none" stroke="#ffffff" stroke-width="8"/>

  <!-- TV Screen Badge overlay at bottom -->
  <rect x="136" y="360" width="240" height="90" rx="18" fill="#020617" stroke="#fb923c" stroke-width="5"/>
  <text x="256" y="415" font-family="sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">SRC TV</text>
  <!-- Stand feet for TV -->
  <path d="M 216 450 L 196 475 M 296 450 L 316 475" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
</svg>
