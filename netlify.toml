[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/ffbb/search"
  to = "/.netlify/functions/ffbb-search"
  status = 200

[[redirects]]
  from = "/api/ffbb/matches"
  to = "/.netlify/functions/ffbb-matches"
  status = 200

[[redirects]]
  from = "/api/generate-caption"
  to = "/.netlify/functions/generate-caption"
  status = 200

[[redirects]]
  from = "/api/social/publish"
  to = "/.netlify/functions/social-publish"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
